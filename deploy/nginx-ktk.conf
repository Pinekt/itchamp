# nginx для КТК ЭЛОУ-АВТ. Ставится в /etc/nginx/sites-available/ktk
# скриптом deploy/install.sh — DOMAIN подставляется при установке.
#
# Карта для WebSocket лежит отдельно, в /etc/nginx/conf.d/ktk-upgrade.conf:
# директива map допустима только в контексте http.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # тренажёр не принимает загрузок, большой размер тела не нужен
    client_max_body_size 1m;

    # сжатие: страницы и JSON разбора хорошо жмутся, картинок здесь нет
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ktk-access.log;
    error_log  /var/log/nginx/ktk-error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # рукопожатие WebSocket для канала тренировки /ws
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # приложение пишет IP в журнал аудита именно отсюда
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Канал тренировки молчит, пока сценарий не запущен: телеметрия идёт
        # только на активной тренировке. При стандартных 60 с nginx рвал бы
        # соединение у оператора, который открыл рабочее место и не спешит.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # телеметрия должна доходить сразу, а не копиться в буфере
        proxy_buffering off;
    }
}
