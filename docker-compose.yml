# Локальный стек КТК ЭЛОУ-АВТ: приложение + PostgreSQL.
# Запуск одной командой:  docker compose up --build
# Открыть в браузере:     http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ktk
      POSTGRES_PASSWORD: ktk
      POSTGRES_DB: ktk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktk -d ktk"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ktk:ktk@db:5432/ktk
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
volumes:
  pgdata:
