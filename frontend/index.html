<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КТК ЭЛОУ-АВТ — рабочее место оператора</title>
<style>
  :root{--bg:#0f1420;--panel:#1a2130;--line:#2b3345;--txt:#e6ebf5;--muted:#8a94a8;
        --accent:#5B2CE0;--ok:#1E7A3D;--warn:#c9821a;--err:#c0392b;--pipe:#3a4a63;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;
         align-items:center;gap:14px}
  header h1{font-size:16px;margin:0;font-weight:600}
  .badge{font-size:12px;padding:3px 9px;border-radius:20px;background:#333;color:#fff}
  .badge.on{background:var(--ok)} .badge.off{background:#555}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
  .gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .g{background:#10161f;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .g .v{font-size:24px;font-weight:700} .g .u{font-size:11px;color:var(--muted)}
  .g .n{font-size:11px;color:var(--muted);margin-bottom:4px}
  .g.alarm{border-color:var(--err);animation:blink 1s infinite}
  @keyframes blink{50%{background:#2a1416}}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 14px;
         font-size:13px;cursor:pointer} button:hover{opacity:.9}
  button.sec{background:#2b3345} button.stop{background:var(--err)}
  .slider{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
  input[type=range]{flex:1}
  .feed{min-height:54px;border-radius:8px;padding:10px;font-size:13px;background:#10161f;border:1px solid var(--line)}
  .feed.info{border-color:var(--line)} .feed.warning{border-left:4px solid var(--warn)}
  .feed.error{border-left:4px solid var(--err)}
  .risk{height:6px;background:#222b3a;border-radius:4px;margin-top:8px;overflow:hidden}
  .risk>i{display:block;height:100%;background:var(--warn)}
  .journal{max-height:230px;overflow:auto;font-size:12px}
  .journal div{padding:5px 0;border-bottom:1px solid var(--line);color:var(--muted)}
  .journal b{color:var(--txt)}
  svg text{fill:var(--txt);font-size:11px}
  /* ---------------------------------------------------------- мнемосхема */
  .mnemo{width:100%;height:auto;display:block}
  /* Трубопроводы и потоки нарисованы одними и теми же путями: поток — это
     <use> на ту же геометрию. Обводка задана на группе, а не на самом пути,
     иначе клон внутри <use> унаследовал бы цвет трубы и поток был бы не виден. */
  .pipes{fill:none;stroke:var(--pipe);stroke-width:7;stroke-linecap:round}
  .streams{fill:none;stroke:#5aa9f0;stroke-width:3;stroke-dasharray:9 15;opacity:0}
  .streams.on{opacity:.9}
  .streams.on use{animation:stream 1.2s linear infinite}
  @keyframes stream{to{stroke-dashoffset:-24}}
  .vessel{fill:#141b27;stroke:#4a5772;stroke-width:2}
  .metal{fill:#222b3a;stroke:#4a5772;stroke-width:2}
  .coil{fill:none;stroke:#6b7a99;stroke-width:3}
  .tray{stroke:#39455e;stroke-width:2}
  .eq-name{fill:var(--txt);font-size:12px;font-weight:700;text-anchor:middle}
  .eq-label{fill:var(--muted);font-size:10px;text-anchor:middle}
  .prod{fill:var(--muted);font-size:10px}
  .sensor circle{fill:#10161f;stroke:#4a5772;stroke-width:2}
  .sensor .code{fill:var(--muted);font-size:9px;text-anchor:middle}
  .sensor .val{fill:var(--txt);font-size:11px;font-weight:600}
  .lead{stroke:#4a5772;stroke-width:1;stroke-dasharray:3 3}
  .clickable{cursor:pointer}
  /* авария подсвечивает и аппарат, и относящийся к нему датчик */
  .alarm .vessel,.alarm .metal,.alarm circle{stroke:var(--err)}
  .alarm .eq-name,.alarm .val{fill:var(--err)}
  .alarm{animation:eqblink 1s infinite}
  @keyframes eqblink{50%{opacity:.5}}
  #flame{transition:opacity .4s}
  .user{font-size:12px;color:var(--muted)} .user b{color:var(--txt)}
  /* элементы только для инструктора/администратора — показываются по роли */
  [data-role]{display:none}
</style>
</head>
<body>
<header>
  <h1>КТК ЭЛОУ-АВТ · рабочее место оператора</h1>
  <span id="conn" class="badge">нет связи</span>
  <span id="run" class="badge off">ОСТАНОВ</span>
  <span style="margin-left:auto;color:var(--muted);font-size:12px">t = <b id="clock">0</b> c</span>
  <span id="who" class="user" title="Текущий пользователь">—</span>
  <button class="sec" onclick="location.href='/debrief'" style="padding:5px 11px;font-size:12px">Разбор</button>
  <button class="sec" data-role="admin" onclick="location.href='/admin'"
          style="padding:5px 11px;font-size:12px">Администрирование</button>
  <button class="sec" id="logout" onclick="logout()" style="padding:5px 11px;font-size:12px">Выход</button>
</header>

<div class="wrap">
  <div>
    <div class="panel">
      <h2>Мнемосхема</h2>
      <svg class="mnemo" viewBox="0 0 950 404" role="img"
           aria-label="Технологическая схема установки ЭЛОУ-АВТ">
        <!-- Трубопроводы. Те же пути переиспользуются ниже для анимации
             потока, поэтому у каждого есть идентификатор. -->
        <g class="pipes">
          <path id="pFeed"    d="M 8 330 H 148"/>
          <path id="pToElou"  d="M 182 330 H 215"/>
          <path id="pToHx"    d="M 319 330 H 356"/>
          <path id="pToFurn"  d="M 404 330 H 436"/>
          <path id="pToCol"   d="M 540 330 H 556 V 250 H 580"/>
          <path id="pBenz"    d="M 676 78 H 790"/>
          <path id="pKero"    d="M 676 150 H 790"/>
          <path id="pDiesel"  d="M 676 225 H 790"/>
          <path id="pMazut"   d="M 628 374 V 392 H 790"/>
        </g>

        <!-- Э-1: электродегидратор (обессоливание и обезвоживание нефти) -->
        <g id="eqElou">
          <rect class="vessel" x="215" y="306" width="104" height="48" rx="24"/>
          <line x1="248" y1="316" x2="248" y2="344" stroke="#6b7a99" stroke-width="2"/>
          <line x1="286" y1="316" x2="286" y2="344" stroke="#6b7a99" stroke-width="2"/>
          <text class="eq-name" x="267" y="335">Э-1</text>
          <text class="eq-label" x="267" y="370">ЭЛОУ · обессоливание</text>
        </g>

        <!-- Т-1: теплообменник подогрева сырья -->
        <g id="eqHx">
          <circle class="vessel" cx="380" cy="330" r="24"/>
          <path class="coil" d="M 362 330 L 370 318 L 380 342 L 390 318 L 398 330"/>
          <text class="eq-label" x="380" y="370">Т-1 · теплообменник</text>
        </g>

        <!-- П-1: трубчатая печь, змеевик и горелки -->
        <g id="eqFurnace">
          <text class="eq-name" x="488" y="264">П-1</text>
          <text class="eq-label" x="488" y="278">печь</text>
          <rect class="metal" x="436" y="284" width="104" height="88" rx="6"/>
          <path class="coil" d="M 448 298 H 528 V 314 H 448 V 330 H 528 V 346 H 448"/>
          <g id="flame" style="opacity:0">
            <path d="M 462 366 q 6 -16 12 0 q -6 8 -12 0" fill="#e8833a"/>
            <path d="M 482 366 q 6 -20 12 0 q -6 8 -12 0" fill="#f0a548"/>
            <path d="M 502 366 q 6 -16 12 0 q -6 8 -12 0" fill="#e8833a"/>
          </g>
        </g>

        <!-- К-1: атмосферная колонна. Тарелки, ввод сырья, куб с уровнем -->
        <g id="eqColumn">
          <text class="eq-name" x="628" y="26">К-1</text>
          <text class="eq-label" x="628" y="40">атмосферная колонна</text>
          <rect class="vessel" x="580" y="48" width="96" height="326" rx="18"/>
          <!-- пустой до первого снимка телеметрии: показывать уровень,
               которого ещё не измеряли, нельзя -->
          <rect id="levelFill" x="582" y="374" width="92" height="0" fill="#25406b" opacity=".75"/>
          <g class="tray">
            <line x1="588" y1="96"  x2="668" y2="96"/>
            <line x1="588" y1="120" x2="668" y2="120"/>
            <line x1="588" y1="144" x2="668" y2="144"/>
            <line x1="588" y1="168" x2="668" y2="168"/>
            <line x1="588" y1="192" x2="668" y2="192"/>
            <line x1="588" y1="216" x2="668" y2="216"/>
            <line x1="588" y1="240" x2="668" y2="240"/>
          </g>
        </g>

        <text class="prod" x="8" y="318">Нефть</text>

        <!-- Насос сырья Н-1 (PUMP_1) — по нажатию включается и выключается.
             Прозрачный прямоугольник поверх задаёт область нажатия: у самих
             фигур попасть можно только в обводку, а мимо тонкой линии
             промахивается и мышь, и палец. -->
        <g id="eqPump" class="clickable" onclick="togglePump()">
          <title>Насос сырья Н-1 — нажмите, чтобы включить или остановить</title>
          <text class="eq-name" x="86" y="296">Н-1</text>
          <text class="eq-label" x="86" y="308">насос сырья</text>
          <circle class="metal" cx="86" cy="330" r="19"/>
          <polygon id="pumpLed" points="79,321 79,339 97,330" fill="#555"/>
          <rect x="63" y="288" width="46" height="64" fill="transparent"/>
        </g>

        <!-- Клапан подачи сырья (VALVE_FEED) -->
        <g id="eqValve">
          <rect class="metal" x="158" y="304" width="14" height="10" rx="2"/>
          <line x1="165" y1="314" x2="165" y2="322" stroke="#4a5772" stroke-width="2"/>
          <polygon points="148,320 165,330 148,340" fill="#4a5772"/>
          <polygon points="182,320 165,330 182,340" fill="#4a5772"/>
          <text class="eq-label" id="valveTag" x="165" y="362">Клапан сырья</text>
        </g>

        <!-- Потоки: та же геометрия, что у труб, только пунктиром и в движении.
             Отборы продуктов идут отдельной группой — они появляются, только
             когда процесс пущен, а не просто есть подача сырья. -->
        <g id="feedFlow" class="streams">
          <use href="#pFeed"/><use href="#pToElou"/><use href="#pToHx"/>
          <use href="#pToFurn"/><use href="#pToCol"/>
        </g>
        <g id="prodFlow" class="streams">
          <use href="#pBenz"/><use href="#pKero"/>
          <use href="#pDiesel"/><use href="#pMazut"/>
        </g>

        <!-- Отборы -->
        <text class="prod" x="798" y="74">Бензин</text>
        <text class="prod" x="798" y="146">Керосин</text>
        <text class="prod" x="798" y="221">Дизельное топливо</text>
        <text class="prod" x="798" y="396">Мазут</text>

        <!-- Приборы. Пузырёк ставится только там, где есть настоящее
             измерение: расход сырья, давление верха, температура и уровень
             куба К-1. Прочие аппараты показаны без КИП — как на схеме. -->
        <g class="sensor" id="sFI">
          <line class="lead" x1="198" y1="301" x2="198" y2="326"/>
          <circle cx="198" cy="286" r="15"/>
          <text class="code" x="198" y="290">FI</text>
          <text class="val" x="198" y="260" text-anchor="middle" id="mF">—</text>
        </g>
        <g class="sensor" id="sPI">
          <line class="lead" x1="676" y1="110" x2="691" y2="110"/>
          <circle cx="706" cy="110" r="15"/>
          <text class="code" x="706" y="114">PI</text>
          <text class="val" x="726" y="114" id="mP">—</text>
        </g>
        <g class="sensor" id="sTI">
          <line class="lead" x1="676" y1="290" x2="691" y2="290"/>
          <circle cx="706" cy="290" r="15"/>
          <text class="code" x="706" y="294">TI</text>
          <text class="val" x="726" y="294" id="mT">—</text>
        </g>
        <g class="sensor" id="sLI">
          <line class="lead" x1="676" y1="348" x2="691" y2="348"/>
          <circle cx="706" cy="348" r="15"/>
          <text class="code" x="706" y="352">LI</text>
          <text class="val" x="726" y="352" id="mL">—</text>
        </g>
      </svg>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>Показания</h2>
      <div class="gauges">
        <div class="g" id="gP"><div class="n">Давление</div><div class="v" id="vP">–</div><div class="u">кПа</div></div>
        <div class="g" id="gT"><div class="n">Температура</div><div class="v" id="vT">–</div><div class="u">°C</div></div>
        <div class="g" id="gF"><div class="n">Расход</div><div class="v" id="vF">–</div><div class="u">м³/ч</div></div>
        <div class="g" id="gL"><div class="n">Уровень</div><div class="v" id="vL">–</div><div class="u">%</div></div>
      </div>
      <div class="slider" style="margin-top:0">Сценарий
        <select id="scenSel" style="flex:1;background:#10161f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px"></select>
        <button onclick="sess('start',$('scenSel').value)">Загрузить</button>
        <button class="sec" onclick="sess('reset')">Сброс</button>
        <button class="sec" onclick="sess('stop')">Завершить</button>
      </div>
      <div id="recBox" style="display:none;font-size:12px;color:var(--muted);
           border-left:2px solid #8ea2ff;padding:4px 0 4px 8px;margin:6px 0"></div>
      <div class="controls">
        <button onclick="cmd('start')">Пуск процесса</button>
        <button class="stop" onclick="cmd('stop')">Останов</button>
        <button class="sec" onclick="cmd('set_pump','PUMP_1',1)">Насос ВКЛ</button>
        <button class="sec" onclick="cmd('set_pump','PUMP_1',0)">Насос ВЫКЛ</button>
        <button class="sec" onclick="cmd('ack_alarm')">Квитировать</button>
      </div>
      <div class="slider">Клапан сырья
        <input type="range" min="0" max="100" value="60"
               oninput="valveLbl.textContent=this.value;cmd('set_valve',null,+this.value)">
        <b id="valveLbl">60</b>%
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>ИИ-ассистент</h2>
      <div id="feed" class="feed info">Ожидание данных…</div>
      <div class="risk"><i id="riskBar" style="width:0%"></i></div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Прогноз риска ошибки</div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Журнал действий</h2>
      <div id="journal" class="journal"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const ROLE_NAMES={operator:'оператор',instructor:'инструктор',admin:'администратор'};
let ws, me=null;

// --- текущий пользователь: кто вошёл и что ему показывать ---
async function loadMe(){
  const r=await fetch('/api/me');
  if(!r.ok){location.href='/login'; return;}
  me=await r.json();
  $('who').innerHTML=`<b>${me.full_name}</b> · ${ROLE_NAMES[me.role]||me.role}`;
  // элементы с data-role показываем только подходящей роли. Снимаем атрибут,
  // а не выставляем display: правило [data-role]{display:none} задано в таблице
  // стилей, и очистка инлайнового стиля его не перебивает
  document.querySelectorAll('[data-role]').forEach(el=>{
    if(el.dataset.role.split(' ').includes(me.role)) el.removeAttribute('data-role');
  });
}
async function logout(){
  await fetch('/api/logout',{method:'POST'});
  location.href='/login';
}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen =()=>{$('conn').textContent='на связи';$('conn').className='badge on';};
  ws.onclose=e=>{
    $('conn').textContent='нет связи';$('conn').className='badge';
    if(e.code===4401){location.href='/login'; return;}   // сеанс истёк
    setTimeout(connect,1500);
  };
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='state')   renderState(m.payload);
    if(m.type==='feedback')renderFeed(m.payload);
    if(m.type==='action')  logAction(m.payload);
    if(m.type==='assessment') showAssessment(m.payload);
    if(m.type==='error')   $('feed').textContent=m.payload.detail;
  };
}
// тренировка завершена — сразу зовём на разбор, пока всё свежо
function showAssessment(a){
  const el=$('feed');
  el.className='feed '+(a.verdict==='passed'?'info':'error');
  el.innerHTML=`<b>Тренировка завершена: ${a.total_score} из 100 — `+
    `${a.verdict==='passed'?'зачёт':'не сдано'}</b><br>`+
    `ошибок ${a.errors_count} (критических ${a.critical_errors})`+
    (a.avg_reaction_ms!=null?`, средняя реакция ${a.avg_reaction_ms} мс`:'')+
    `<br><a href="/debrief?session=${encodeURIComponent(a.session_id)}"
        style="color:#8ea2ff">Открыть разбор тренировки →</a>`;
  loadScenarios();   // история пополнилась — подбор следующего изменился
}
function cmd(action,target=null,value=null){
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({action,target,value}));
}
function sess(session_action,scenario=null){
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({session_action,scenario}));
  if(session_action==='start') $('journal').innerHTML='';
}
async function loadScenarios(){
  const r=await fetch('/api/scenarios');
  if(!r.ok){location.href='/login'; return;}
  const list=await r.json();
  $('scenSel').innerHTML=list.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  showRecommendation(list);
}
// Что тренировать дальше — подбор по истории ошибок (ИИ-модуль).
// Отдельным запросом и без await в loadScenarios: список сценариев должен
// появиться в любом случае, даже если подбор не ответил.
async function showRecommendation(list){
  let rec=null;
  try{
    const r=await fetch('/api/recommendation');
    if(!r.ok) return;
    rec=(await r.json()).recommendation;
  }catch(e){ return; }
  const s=rec && list.find(x=>x.id===rec.scenario);
  if(!s) return;
  $('scenSel').value=s.id;      // подставляем, но не запускаем: решает человек
  const box=$('recBox');
  // textContent, а не innerHTML: строка приходит с сервера и в разметку
  // попадать не должна
  box.textContent='Рекомендуется: '+s.name+'. '+rec.why;
  box.style.display='';
}
// Насос переключается и нажатием на схеме — как на настоящем рабочем месте.
// Текущее положение помним здесь: команда одна и та же на включение и на
// останов, а без состояния нажатие пришлось бы угадывать.
let pumpOn=true;
function togglePump(){ cmd('set_pump','PUMP_1', pumpOn?0:1); }

function mark(id,on){ $(id).classList.toggle('alarm', !!on); }

function renderState(s){
  $('clock').textContent=s.t;
  $('vP').textContent=s.pressure; $('vT').textContent=s.temperature;
  $('vF').textContent=s.flow;     $('vL').textContent=s.level;
  $('run').textContent=s.running?'В РАБОТЕ':'ОСТАНОВ';
  $('run').className='badge '+(s.running?'on':'off');

  // показания у приборов на схеме
  $('mP').textContent=s.pressure+' кПа'; $('mT').textContent=s.temperature+' °C';
  $('mF').textContent=s.flow+' м³/ч';    $('mL').textContent=s.level+' %';

  const eq=id=>(s.equipment||[]).find(e=>e.id===id);
  const pump=eq('PUMP_1'), valve=eq('VALVE_FEED'), heater=eq('HEATER_1');
  pumpOn = !!(pump && pump.on);
  $('pumpLed').setAttribute('fill', pumpOn ? '#28c76f':'#555');
  if(valve) $('valveTag').textContent='Клапан сырья · '+valve.position+' %';
  $('flame').style.opacity = (heater && heater.on && s.running) ? 1 : 0;

  // Движение в трубопроводах. Сырьё идёт, пока есть расход; отборы — только
  // на пущенной установке: на остановленной продуктов из колонны нет.
  const moving=s.flow>1;
  $('feedFlow').classList.toggle('on', moving);
  $('prodFlow').classList.toggle('on', moving && s.running);
  // чем больше расход, тем быстрее бежит пунктир
  const period=Math.max(0.35, 2.2 - s.flow/90).toFixed(2)+'s';
  document.querySelectorAll('.streams use')
          .forEach(u=>{u.style.animationDuration=period;});

  // уровень в кубе колонны: 100 % — 100 px, низ аппарата на y = 374
  const h=Math.max(0,Math.min(100,s.level));
  $('levelFill').setAttribute('y',374-h); $('levelFill').setAttribute('height',h);

  // подсветка аварий — и на приборах панели, и на схеме
  const hiP=s.alarms.includes('HIGH_PRESSURE');
  const badL=s.alarms.some(a=>a.includes('LEVEL'));
  const hiT=s.alarms.includes('HIGH_TEMP');
  $('gP').className='g'+(hiP?' alarm':'');
  $('gL').className='g'+(badL?' alarm':'');
  $('gT').className='g'+(hiT?' alarm':'');
  mark('sPI',hiP); mark('sLI',badL); mark('sTI',hiT);
  mark('eqColumn', hiP||badL||hiT); mark('eqFurnace', hiT);
}
function renderFeed(f){
  const el=$('feed'); el.className='feed '+f.severity;
  // прогноз показываем отдельной строкой: это предупреждение ДО аварии,
  // и оператору важно видеть, сколько у него осталось времени
  const forecast = f.predicted_alarm_s!=null
    ? `<br><b>До уставки ≈ ${Math.round(f.predicted_alarm_s)} с</b>` : '';
  el.innerHTML=(f.error_detected?'<b>⚠ Ошибка: '+(f.error_class||'')+'</b><br>':'')+
    f.message+forecast+
    (f.recommendation?'<br><i>Рекомендация: '+f.recommendation+'</i>':'')+
    (f.reference?'<br><span style="font-size:11px;color:var(--muted)">Основание: '
                 +f.reference+'</span>':'');
  $('riskBar').style.width=Math.round((f.risk_score||0)*100)+'%';
}
function logAction(a){
  const d=document.createElement('div');
  d.innerHTML=`t=${a.t}c · <b>${a.action}</b>${a.target?' '+a.target:''}${a.value!=null?' = '+a.value:''}`+
              `${a.reaction_ms!=null?` · реакция ${a.reaction_ms} мс`:''}`;
  $('journal').prepend(d);
}
// вход обязателен: сначала выясняем, кто мы, потом поднимаем канал
loadMe().then(loadScenarios).then(connect);
</script>
